<!DOCTYPE html><html lang="cs"><head>
	<meta charset="UTF-8">
	<script type="application/ld+json">
			{
				"@context":"https://schema.org",
				"@type":"WebSite",
				"url":"https://{{name}}",
				"name":"{{title}}",
				"description":"{{description}}",
				"publisher": {
					"@type":"Organization",
					"name":"{{author}}",
					"url":"https://{{name}}",
					"logo": {
						"@type":"ImageObject",
						"url":"https://{{name}}/img/icons/icon-512x512.png",
						"width": 512,
						"height": 512
					},
					"contactPoint": {
						"@type":"ContactPoint",
						"contactType":"Customer Support",
						"email":"{{email}}",
						"telephone":"{{fullPhone}}",
						"areaServed":"CZ"
					}
				}
			}
		</script>

	<title data-keep="title">{{title}} | 404 - Stránka nebyla nalezena</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="{{author}}">
	<meta name="robots" content="index, follow">

	<meta name="title" property="og:title" content="{{title}}">
	<meta name="description" property="og:description" content="{{description}}">
	<meta name="keywords" property="og:keywords" content="{{keywords}}">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="{{name}}">
	<meta property="og:locale" content="cs_CS">
	<meta property="og:url" content="https://{{name}}/index.html">
	<meta property="og:image" content="https://{{name}}/img/socialniSite.webp">
	<meta property="og:image:alt" content="{{altPortret}}">

	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="{{title}}">
	<meta name="twitter:description" content="{{description}}">
	<meta name="twitter:image" content="https://{{name}}/img/x.webp">

	<link rel="stylesheet" href="w3.css">
	<link rel="stylesheet" href="styles.css">
	<script src="scripts.js"></script>
	<!--{{style}}-->
	<!--{{script}}-->
	<link rel="apple-touch-icon" sizes="180x180" href="./img/icons/icon-180x180.png">
	<link rel="icon" type="image/x-icon" sizes="48x48" href="./img/icons/favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="./img/icons/icon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./img/icons/icon-16x16.png">
	<link rel="manifest" href="./site.webmanifest">
	<link rel="canonical" href="https://{{name}}/">
</head>

<body>
	<div class="w3-overlay w3-hide-large w3-animate-opacity menuCloser" title="Zavři menu" id="myOverlay"></div>
	<div class="w3-top">
		<div class="w3-bar color-2" id="myNavbar">
			<a href="index.html#home" class="w3-bar-item logoWrapp">
				<img class="logo" alt="logo" src="img/logoObdelnik.webp">
			</a>
			<div class="w3-center w3-hide-small w3-hide-medium">
				<a href="mailto:{{email}}" class="w3-bar-item w3-large">
					<svg class="fa">
						<use xlink:href="sprites/fa-solid.svg#envelope"></use>
					</svg>
					{{email}}
				</a>
				<a href="tel:{{fullPhone}}" class="w3-bar-item w3-large">
					<svg class="fa">
						<use xlink:href="sprites/fa-solid.svg#phone"></use>
					</svg>
					{{phone}}
				</a>
			</div>
			<div class="w3-right w3-hide-small w3-hide-medium">
				<a href="index.html#about" class="w3-bar-item w3-large">
					<svg class="fa">
						<use xlink:href="sprites/fa-solid.svg#user"></use>
					</svg>
					O MNĚ
				</a>
				<a href="index.html#why" class="w3-bar-item">
					<svg class="fa">
						<use xlink:href="sprites/fa-solid.svg#hand-peace"></use>
					</svg>
					VIZE
				</a>
				<a href="index.html#contact" class="w3-bar-item">
					<svg class="fa">
						<use xlink:href="sprites/fa-solid.svg#address-card"></use>
					</svg>
					KONTAKT
				</a>
			</div>
			<span class="menuOpener w3-bar-item w3-right w3-hide-large">
				<svg class="fa">
					<use xlink:href="sprites/fa-solid.svg#bars"></use>
				</svg>
			</span>
		</div>
	</div>
	<nav class="menuCloser w3-sidebar w3-bar-block color-2 w3-card w3-animate-left w3-hide-large" id="mySidebar">
		<div class="w3-bar-item closer">
			<svg class="fa w3-right">
				<use xlink:href="sprites/fa-solid.svg#close"></use>
			</svg>
		</div>
		<a href="index.html#about" class="w3-bar-item w3-right-align">O MNĚ</a>
		<a href="index.html#why" class="w3-bar-item w3-right-align">VIZE</a>
		<a href="index.html#contact" class="w3-bar-item w3-right-align">KONTAKT</a>
	</nav>
	<header class="w3-display-container" id="home">
		<div class="bigTitle w3-display-left w3-text-white">
			<h1>{{h1}}</h1>
			<h2>{{fullName}}</h2>
		</div>
		<a href="index.html#contact" class="w3-button w3-padding-large w3-margin-right w3-hide-small w3-display-right w3-hide-medium">Zeptejte se</a>
		<div class="contactIcons">
			<a href="mailto:{{email}}" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-solid.svg#envelope"></use>
				</svg>
			</a>

			<a href="tel:{{fullPhone}}" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-solid.svg#phone"></use>
				</svg>
			</a>

			<a href="{{facebook}}" target="_blank" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#facebook-square"></use>
				</svg>
			</a>

			<a href="{{twitter}}" target="_blank" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#x-twitter"></use>
				</svg>
			</a>
			<a href="{{instagram}}" target="_blank" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#instagram"></use>
				</svg>
			</a>
			<a href="{{linkedin}}" target="_blank" rel="nofollow">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#linkedin"></use>
				</svg>
			</a>
		</div>
	</header>
	<section class="w3-padding-48" data-keep="content">
		<h3 class="error w3-padding-48 w3-center w3-xxxlarge">
			Stránka nebyla nalezena Chyba 404
		</h3>
	</section>
	<footer class="w3-center color-2 w3-padding-64">
		<a href="#home" class="w3-button">
			<svg class="fa">
				<use xlink:href="sprites/fa-solid.svg#arrow-up"></use>
			</svg>
			Zpět na začátek
		</a>
		<div class="w3-section contactIcons">
			<a href="mailto:{{email}}" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-solid.svg#envelope"></use>
				</svg>
			</a>

			<a href="tel:{{fullPhone}}" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-solid.svg#phone"></use>
				</svg>
			</a>
			<a href="{{facebook}}" target="_blank" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#facebook-square"></use>
				</svg>
			</a>
			<a href="{{twitter}}" target="_blank" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#x-twitter"></use>
				</svg>
			</a>
			<a href="{{instagram}}" target="_blank" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#instagram"></use>
				</svg>
			</a>
			<a href="{{linkedin}}" target="_blank" rel="nofollow" class="w3-hover-opacity">
				<svg class="fa">
					<use xlink:href="sprites/fa-brands.svg#linkedin"></use>
				</svg>
			</a>
		</div>

		<div>
			{{year}} | <a href="{{authorURL}}" rel="nofollow" target="_blank" title="Otevři stránky autora">{{author}}</a> <img src="{{tracker}}{{name}}" class="w3-hide" alt="Visitor Tracking">
		</div>
	</footer>
	<div id="modal" class="w3-modal w3-black">
		<span class="w3-button w3-xxlarge w3-black w3-display-topright" title="Zavřít okno">
			<svg class="fa w3-right">
				<use xlink:href="sprites/fa-solid.svg#close"></use>
			</svg>

		</span>
		<div class="w3-modal-content w3-animate-zoom w3-center w3-transparent">
			<img id="modalImage" class="w3-image" alt="popisek" src="./img/20letSpolu.webp">
			<p id="caption" class="w3-opacity w3-large"></p>
		</div>
	</div>


</body></html>
